<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">SoftwareFactory roadmap v2 dependencies</title><desc id="desc">M01 autonomous factory is the critical path. M02 speed experiments can overlap and speed acceptance follows M01. FamilyTree is the first consumer; Spellbook and FamilyHub then proceed independently subject to their own gates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#607589"/></marker></defs><rect width="960" height="530" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><text x="480" y="33" text-anchor="middle" font-size="25" font-weight="700" fill="#183047">Roadmap v2 • milestone dependencies</text><text x="480" y="56" text-anchor="middle" font-size="14" font-weight="400" fill="#183047">Entry and exit criteria are in ROADMAP.md and the linked issues.</text><rect x="280" y="81" width="400" height="64" rx="10" fill="#e1eaf7" stroke="#8497aa" stroke-width="1.5"/><text x="480" y="107" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">M01 • Autonomous SoftwareFactory</text><text x="480" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">GitHub-hosted · three accepted unattended issues</text><path d="M480 145 V177 H235 V202" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><path d="M480 177 H725 V202" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><rect x="45" y="206" width="380" height="64" rx="10" fill="#f5e8cb" stroke="#8497aa" stroke-width="1.5"/><text x="235" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">M02 • Fast SoftwareFactory</text><text x="235" y="253" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Measured CI, PR and accepted throughput improvement</text><rect x="535" y="206" width="380" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="725" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">M03 • FamilyTree</text><text x="725" y="253" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">First independently authorized consumer</text><text x="235" y="292" text-anchor="middle" font-size="12" font-weight="500" fill="#183047">Safe speed experiments may overlap M01.</text><text x="235" y="309" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">M02 completion is not a consumer prerequisite.</text><path d="M725 270 V326 H235 V357" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><path d="M725 326 V357" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><rect x="45" y="361" width="380" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="235" y="387" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">M04 • Spellbook</text><text x="235" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Independent gates · platform checks · own authorization</text><rect x="535" y="361" width="380" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="725" y="387" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">M05 • FamilyHub</text><text x="725" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Independent gates · freeze/readiness · own authorization</text><text x="480" y="463" text-anchor="middle" font-size="14" font-weight="600" fill="#183047">M04 and M05 can proceed independently after M03; preparation may overlap.</text><text x="480" y="486" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">No production deployment, permission change, new spend or live activation is implied.</text></g></svg>
