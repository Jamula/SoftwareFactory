<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">GitHub-hosted SoftwareFactory target architecture</title><desc id="desc">GitHub orchestrates trusted events, scheduling, isolated hosted workers and protected delivery. Durable state and included capacity must be proven. Consumers enroll independently; the personal laptop is optional.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#607589"/></marker></defs><rect width="960" height="720" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><text x="480" y="32" text-anchor="middle" font-size="25" font-weight="700" fill="#183047">SoftwareFactory • GitHub-hosted architecture</text><text x="480" y="55" text-anchor="middle" font-size="14" font-weight="400" fill="#183047">M01 target — not an active deployment claim</text><rect x="120" y="75" width="720" height="64" rx="10" fill="#e1eaf7" stroke="#8497aa" stroke-width="1.5"/><text x="480" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">GitHub • orchestration authority</text><text x="480" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Issues · trusted events · Actions · default-off scheduled recovery</text><path d="M480 139 V161" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><rect x="120" y="165" width="720" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="480" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">Coordinator and durable cross-run state</text><text x="480" y="212" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Policy · scheduling · ownership fences · quotas · recovery</text><text x="480" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#183047">Verified persistent mechanism required; ephemeral disk is not durable authority.</text><path d="M480 254 V273" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><rect x="48" y="278" width="864" height="108" rx="12" fill="#ffffff" stroke="#8497aa"/><text x="480" y="301" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">Isolated hosted workers • conditional capacity</text><rect x="67" y="312" width="196" height="40" rx="8" fill="#e1eaf7" stroke="#8497aa"/><text x="165" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#183047">Worker 01</text><rect x="277" y="312" width="196" height="40" rx="8" fill="#e1eaf7" stroke="#8497aa"/><text x="375" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#183047">Worker 02</text><rect x="487" y="312" width="196" height="40" rx="8" fill="#e1eaf7" stroke="#8497aa"/><text x="585" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#183047">Worker 03</text><rect x="697" y="312" width="196" height="40" rx="8" fill="#e1eaf7" stroke="#8497aa"/><text x="795" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#183047">… Worker 12</text><text x="480" y="373" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">1 → 2 → 4 → 8 → 10 → 12 only after actual included capacity and safety verification</text><path d="M480 386 V410" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><rect x="120" y="414" width="720" height="64" rx="10" fill="#f5e8cb" stroke="#8497aa" stroke-width="1.5"/><text x="480" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">Independent review + protected integration</text><text x="480" y="461" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Exact-head CI · security · coverage · expected-head merge · verified main</text><path d="M480 478 V504" fill="none" stroke="#607589" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#183047">Independent repository authority and immutable pins</text><rect x="48" y="540" width="204" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="150" y="566" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">SoftwareFactory</text><text x="150" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Own policy · quota · stop</text><rect x="268" y="540" width="204" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="370" y="566" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">FamilyTree</text><text x="370" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Own policy · quota · stop</text><rect x="488" y="540" width="204" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="590" y="566" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">Spellbook</text><text x="590" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Own policy · quota · stop</text><rect x="708" y="540" width="204" height="64" rx="10" fill="#e2f1ea" stroke="#8497aa" stroke-width="1.5"/><text x="810" y="566" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">FamilyHub</text><text x="810" y="587" text-anchor="middle" font-size="12" font-weight="400" fill="#183047">Own policy · quota · stop</text><rect x="48" y="628" width="864" height="65" rx="10" fill="#fff" stroke="#8497aa" stroke-dasharray="6 4"/><text x="480" y="653" text-anchor="middle" font-size="17" font-weight="700" fill="#183047">Personal laptop: optional development and troubleshooting only</text><text x="480" y="675" text-anchor="middle" font-size="13" font-weight="400" fill="#183047">No dependency on a laptop, always-on local polling, or continuously open chat.</text></g></svg>
