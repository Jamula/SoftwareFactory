<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" role="img" aria-labelledby="title desc"><title id="title">SoftwareFactory target architecture</title><desc id="desc">Shared versioned core flows through reusable workflows into four independently configured consumer repositories; live dispatch is not implemented.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#52657b"/></marker></defs><rect width="960" height="474" rx="18" fill="#f3f6fa"/><g font-family="system-ui, sans-serif" fill="#14283e"><text x="480" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#14283e">SoftwareFactory • target architecture</text><text x="480" y="59" text-anchor="middle" font-size="15" font-weight="400" fill="#14283e">Shared implementation / independent repository authority</text><rect x="105" y="82" width="750" height="80" rx="11" fill="#e1ecfa" stroke="#4375aa" stroke-width="1.5"/><text x="480" y="118" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Versioned shared core</text><text x="480" y="141" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Policy evaluation · dependency scheduling · review/merge gates · budget · telemetry</text><path d="M480 162 V190" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="194" width="470" height="72" rx="11" fill="#e6f4f3" stroke="#458d86" stroke-width="1.5"/><text x="480" y="226" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Reusable GitHub workflows</text><text x="480" y="249" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Immutable SHA pins · metadata-only shadow first</text><path d="M480 266 V290 H145 V316" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 266 V290 H367 V316" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 266 V290 H593 V316" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 266 V290 H815 V316" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="320" width="206" height="76" rx="11" fill="#ffffff" stroke="#94a8bf" stroke-width="1.5"/><text x="145" y="354" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">FamilyTree</text><text x="145" y="377" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Local policy + .NET CI</text><rect x="264" y="320" width="206" height="76" rx="11" fill="#ffffff" stroke="#94a8bf" stroke-width="1.5"/><text x="367" y="354" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Spellbook</text><text x="367" y="377" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Local policy + Blazor CI</text><rect x="490" y="320" width="206" height="76" rx="11" fill="#ffffff" stroke="#94a8bf" stroke-width="1.5"/><text x="593" y="354" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Family Hub</text><text x="593" y="377" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Local policy + Cloudflare CI</text><rect x="712" y="320" width="206" height="76" rx="11" fill="#ffffff" stroke="#94a8bf" stroke-width="1.5"/><text x="815" y="354" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Future repo</text><text x="815" y="377" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Explicit authorization</text><text x="480" y="427" text-anchor="middle" font-size="15" font-weight="600" fill="#14283e">Every consumer owns its permissions, budget, stop control and release authorization.</text><text x="480" y="451" text-anchor="middle" font-size="14" font-weight="400" fill="#805220">Today: synthetic read-only evaluator. Live dispatch and merge are not implemented.</text></g></svg>
