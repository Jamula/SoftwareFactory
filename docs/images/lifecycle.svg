<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" aria-labelledby="title desc"><title id="title">Target autonomous delivery lifecycle</title><desc id="desc">Discover, ready, active, review, eligible, merge, verify main, unblock; missing evidence or a stop routes to blocked and reconcile.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#52657b"/></marker></defs><rect width="960" height="496" rx="18" fill="#f3f6fa"/><g font-family="system-ui, sans-serif" fill="#14283e"><text x="480" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#14283e">Autonomous delivery lifecycle • target design</text><text x="480" y="60" text-anchor="middle" font-size="15" font-weight="400" fill="#14283e">Fresh evidence at every transition; blocked work never bypasses a gate.</text><rect x="36" y="88" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="132" y="124" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Discover</text><text x="132" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Approved backlog</text><rect x="268" y="88" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="364" y="124" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Ready</text><text x="364" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Dependencies + quota</text><rect x="500" y="88" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="596" y="124" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Active</text><text x="596" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Scoped agent lease</text><rect x="732" y="88" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="828" y="124" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Review</text><text x="828" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">CI + independent review</text><rect x="732" y="238" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="828" y="274" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Eligible</text><text x="828" y="297" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Exact-head evidence</text><rect x="500" y="238" width="192" height="80" rx="11" fill="#e1ecfa" stroke="#94a8bf" stroke-width="1.5"/><text x="596" y="274" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Merge</text><text x="596" y="297" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Authorized adapter</text><rect x="268" y="238" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="364" y="274" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Verify main</text><text x="364" y="297" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Integration evidence</text><rect x="36" y="238" width="192" height="80" rx="11" fill="#fff" stroke="#94a8bf" stroke-width="1.5"/><text x="132" y="274" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Unblock</text><text x="132" y="297" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Next eligible task</text><path d="M228 128 H264" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M460 128 H496" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M692 128 H728" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M828 168 V234" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M732 278 H696" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 278 H464" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M268 278 H232" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M132 238 V174" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="371" width="412" height="77" rx="11" fill="#fff0d9" stroke="#bf8a3d" stroke-width="1.5"/><text x="480" y="405.5" text-anchor="middle" font-size="18" font-weight="650" fill="#14283e">Blocked / reconcile</text><text x="480" y="428.5" text-anchor="middle" font-size="13" font-weight="400" fill="#344e66">Stale head · missing review · quota · stop</text><path d="M828 318 V409 H690" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M364 318 V355 H480 V367" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="#805220">Current: synthetic evaluation only. Event adapters and mutations remain future work.</text></g></svg>
