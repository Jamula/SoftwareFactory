name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - name: Set up .NET SDK 10.0.404
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false

      - name: Configure .NET telemetry opt-out and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1
          export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          printf '%s\n' \
            'DOTNET_CLI_TELEMETRY_OPTOUT=1' \
            'DOTNET_NOLOGO=1' \
            'DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1' >> "$GITHUB_ENV"
          npm ci --ignore-scripts
          dotnet restore tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --source https://api.nuget.org/v3/index.json

      - name: Verify pinned toolchains and persisted telemetry opt-out
        shell: bash
        run: |
          set -euo pipefail
          test "${DOTNET_CLI_TELEMETRY_OPTOUT:-}" = "1"
          test "${DOTNET_NOLOGO:-}" = "1"
          test "$(node --version)" = "v26.13.1"
          test "$(dotnet --version)" = "10.0.404"
