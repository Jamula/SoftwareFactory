# gh-aw-manifest: {"version":1,"secrets":[],"actions":[{"repo":"actions/checkout","sha":"3d3c42e5aac5ba805825da76410c181273ba90b1","version":"v7.0.1"},{"repo":"actions/setup-node","sha":"949feb2413d6458794dcd2491c4babbbce0c15c1","version":"v7.1.0"},{"repo":"actions/upload-artifact","sha":"cf430e030ddbb5b0abf93d22962f4752f3646cd9","version":"v7.0.2"},{"repo":"actions/download-artifact","sha":"9000827ccba6bdab643e8b6fd33ac0654aef8333","version":"v8.0.2"}]}
# gh-aw-commit: 399a445fe2d8926c616b54b1b82a16b5b2be4445
# gh-aw-work-queue-protocol: v3

name: Factory gh-aw outer orchestrator
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number for read-only dry-run evaluation
        required: false
        type: string
        default: ''
      mode:
        description: Orchestrator execution mode (shadow reconciliation, synthetic smoke, or lock verification)
        required: false
        type: choice
        default: shadow
        options:
          - shadow
          - smoke
          - verify-lock
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: ["Factory validation", "Windows Aspire runtime", ".NET MAF specialist agents"]
    types: [completed]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-ghaw-orchestrator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ vars.FACTORY_GHAW_ENABLED == 'true' && github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715' && github.ref == 'refs/heads/main' && github.ref_protected == true && !endsWith(github.actor, '[bot]') && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.id == 1471342715) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      expected_work_queue_oid: ${{ steps.shadow_eval.outputs.expected_work_queue_oid }}
      handoff_sha256: ${{ steps.shadow_eval.outputs.handoff_sha256 }}
    steps:
      - name: Checkout immutable protected-branch workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify gh-aw workflow lock and execute shadow evaluation
        id: shadow_eval
        env:
          FACTORY_GHAW_ENABLED: ${{ vars.FACTORY_GHAW_ENABLED }}
          FACTORY_GHAW_MODE: ${{ inputs.mode || 'shadow' }}
          FACTORY_EXPECTED_WORKFLOW_PATH: .github/workflows/factory-orchestrator.lock.yml
          FACTORY_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '' }}
          FACTORY_PULL_NUMBER: ${{ github.event.pull_request.number || '' }}
          FACTORY_PULL_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          FACTORY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          FACTORY_CHECK_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
          FACTORY_WORKFLOW_HEAD_REPO_ID: ${{ github.event.workflow_run.head_repository.id || '' }}
          FACTORY_MAIN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$FACTORY_GHAW_ENABLED" = true
          test "$GITHUB_REPOSITORY" = Jamula/SoftwareFactory
          test "$GITHUB_REPOSITORY_ID" = 1471342715
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_WORKFLOW_REF" = Jamula/SoftwareFactory/.github/workflows/factory-orchestrator.lock.yml@refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$FACTORY_WORKFLOW_HEAD_REPO_ID" = 1471342715
          fi
          FACTORY_GHAW_MODE="${FACTORY_GHAW_MODE:-shadow}"
          case "$FACTORY_GHAW_MODE" in
            shadow|smoke|verify-lock) ;;
            *) echo "::error::Unsupported orchestrator mode"; exit 1 ;;
          esac
          if [ -n "$FACTORY_ISSUE_NUMBER" ] && ! printf '%s' "$FACTORY_ISSUE_NUMBER" | grep -Eq '^[1-9][0-9]{0,9}$'; then
            echo "::error::Invalid issue_number input"
            exit 1
          fi
          for numeric_id in "$FACTORY_PULL_NUMBER" "$FACTORY_WORKFLOW_RUN_ID"; do
            if [ -n "$numeric_id" ] && ! printf '%s' "$numeric_id" | grep -Eq '^[1-9][0-9]{0,15}$'; then
              echo "::error::Invalid numeric event identifier"
              exit 1
            fi
          done
          for commit_sha in "$GITHUB_WORKFLOW_SHA" "$FACTORY_PULL_HEAD" "$FACTORY_CHECK_HEAD" "$FACTORY_MAIN_HEAD"; do
            if [ -n "$commit_sha" ] && ! printf '%s' "$commit_sha" | grep -Eq '^[a-f0-9]{40}$'; then
              echo "::error::Invalid event commit SHA"
              exit 1
            fi
          done
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {verifyEventTriggerMatrix, verifyGhAwWorkflowLock} from "./tools/engineering-factory/gh-aw-lock-verifier.mjs";
            const markdownSource = readFileSync(".github/workflows/factory-orchestrator.md", "utf8");
            const lockYamlSource = readFileSync(".github/workflows/factory-orchestrator.lock.yml", "utf8");
            const verdict = verifyGhAwWorkflowLock({markdownSource, lockYamlSource});
            const matrixVerdict = verifyEventTriggerMatrix(lockYamlSource);
            if (!verdict.valid || !matrixVerdict.valid) {
              console.error(JSON.stringify({verdict, matrixVerdict}));
              process.exit(1);
            }
            console.log(JSON.stringify({verdict, matrixVerdict}));
          '
          if [ "$FACTORY_GHAW_MODE" = smoke ]; then
            node tools/engineering-factory/run.mjs --smoke
          elif [ "$FACTORY_GHAW_MODE" = shadow ]; then
            case "$GITHUB_EVENT_NAME" in
              schedule|workflow_dispatch|issues|pull_request_target|workflow_run|push) ;;
              *) echo "::error::Unsupported orchestrator event"; exit 1 ;;
            esac
            node tools/engineering-factory/run.mjs --smoke
            test -n "$GITHUB_WORKFLOW_SHA"
            FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
            test "$FACTORY_CHECKOUT_SHA" = "$GITHUB_WORKFLOW_SHA"
            export FACTORY_CHECKOUT_SHA
            SNAPSHOT_WORK_FILE="${RUNNER_TEMP:-/tmp}/factory-event-journal-snapshot.json"
            CURSOR_WORK_FILE="${RUNNER_TEMP:-/tmp}/factory-recovery-cursor.json"
            HANDOFF_FILE="${RUNNER_TEMP:-/tmp}/factory-work-queue-handoff.json"
            EXPECTED_WORK_QUEUE_OID="0000000000000000000000000000000000000000"
            if git fetch --quiet --no-tags --depth=1 origin refs/heads/work-queue 2>/dev/null; then
              EXPECTED_WORK_QUEUE_OID="$(git rev-parse FETCH_HEAD)"
              if [ ! -s "$SNAPSHOT_WORK_FILE" ]; then
                git show FETCH_HEAD:state/event-journal-snapshot.json > "$SNAPSHOT_WORK_FILE" 2>/dev/null || rm -f "$SNAPSHOT_WORK_FILE"
              fi
              if [ ! -s "$CURSOR_WORK_FILE" ]; then
                git show FETCH_HEAD:state/recovery-cursor.json > "$CURSOR_WORK_FILE" 2>/dev/null || rm -f "$CURSOR_WORK_FILE"
              fi
            fi
            export SNAPSHOT_WORK_FILE CURSOR_WORK_FILE HANDOFF_FILE EXPECTED_WORK_QUEUE_OID
            node --input-type=module -e '
              import {appendFileSync, existsSync, renameSync, statSync, writeFileSync, readFileSync} from "node:fs";
              import {buildShadowJournalHandoff, reconcileShadowOrchestratorRun} from "./tools/engineering-factory/shadow-runtime.mjs";
              const snapPath = process.env.SNAPSHOT_WORK_FILE;
              const cursorPath = process.env.CURSOR_WORK_FILE;
              const handoffPath = process.env.HANDOFF_FILE;
              const expectedWorkQueueOid = process.env.EXPECTED_WORK_QUEUE_OID;
              let priorSnapshot;
              if (snapPath && existsSync(snapPath)) {
                const st = statSync(snapPath);
                if (st.size > 0) {
                  if (st.size > 2097152) process.exit(1);
                  priorSnapshot = JSON.parse(readFileSync(snapPath, "utf8"));
                }
              }
              let priorCursor = 0;
              if (cursorPath && existsSync(cursorPath)) {
                const cst = statSync(cursorPath);
                if (cst.size > 0 && cst.size <= 4096) {
                  const parsedCursor = JSON.parse(readFileSync(cursorPath, "utf8"));
                  if (Number.isSafeInteger(parsedCursor?.pullCursor) && parsedCursor.pullCursor >= 0) {
                    priorCursor = parsedCursor.pullCursor;
                  }
                }
              }
              const {snapshot, ...publicResult} = await reconcileShadowOrchestratorRun(
                process.env,
                {
                  pullCursor: priorCursor,
                  ...(priorSnapshot !== undefined ? {snapshot: priorSnapshot} : {})
                }
              );
              if (publicResult.reason === "TRUST_UNKNOWN" || publicResult.reason === "INVALID_SNAPSHOT" || publicResult.reason === "LEASE_CONFLICT") {
                console.error(JSON.stringify(publicResult));
                process.exit(1);
              }
              if (snapshot && snapshot.exported && snapPath && handoffPath) {
                const nextCursor = Number.isSafeInteger(publicResult.pullCursor) ? publicResult.pullCursor : priorCursor;
                const built = buildShadowJournalHandoff({
                  expectedWorkQueueOid,
                  snapshot,
                  pullCursor: nextCursor,
                  repositoryId: publicResult.repositoryId ?? 1471342715
                });
                if (!built.ok) process.exit(1);
                writeFileSync(`${snapPath}.tmp`, JSON.stringify(built.handoff.snapshot), "utf8");
                renameSync(`${snapPath}.tmp`, snapPath);
                if (cursorPath) {
                  writeFileSync(`${cursorPath}.tmp`, JSON.stringify({schemaVersion: 1, pullCursor: nextCursor}), "utf8");
                  renameSync(`${cursorPath}.tmp`, cursorPath);
                }
                writeFileSync(`${handoffPath}.tmp`, built.serialized, "utf8");
                renameSync(`${handoffPath}.tmp`, handoffPath);
                if (process.env.GITHUB_OUTPUT) {
                  appendFileSync(
                    process.env.GITHUB_OUTPUT,
                    `expected_work_queue_oid=${expectedWorkQueueOid}\nhandoff_sha256=${built.sha256}\n`,
                    "utf8"
                  );
                }
              }
              console.log(JSON.stringify(publicResult));
            '
          fi
      - name: Upload verified shadow journal handoff artifact
        if: steps.shadow_eval.outputs.handoff_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-work-queue-handoff
          path: ${{ runner.temp }}/factory-work-queue-handoff.json
          if-no-files-found: error
          retention-days: 1

  threat-and-policy-scan:
    needs: [evaluate]
    if: ${{ vars.FACTORY_GHAW_ENABLED == 'true' && needs.evaluate.result == 'success' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scan_verified: ${{ steps.policy_scan.outputs.scan_verified }}
    steps:
      - name: Checkout immutable protected-branch workflow revision for policy scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify non-mutation and protected-control-plane posture
        id: policy_scan
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {verifyEventTriggerMatrix, verifyGhAwWorkflowLock} from "./tools/engineering-factory/gh-aw-lock-verifier.mjs";
            const markdownSource = readFileSync(".github/workflows/factory-orchestrator.md", "utf8");
            const lockYamlSource = readFileSync(".github/workflows/factory-orchestrator.lock.yml", "utf8");
            const verdict = verifyGhAwWorkflowLock({markdownSource, lockYamlSource});
            const matrixVerdict = verifyEventTriggerMatrix(lockYamlSource);
            if (!verdict.valid || !matrixVerdict.valid || verdict.liveDispatch !== false || verdict.liveMerge !== false) {
              process.exit(1);
            }
          '
          echo "scan_verified=true" >> "$GITHUB_OUTPUT"

  # Separately authorized durable Compare-and-Swap persistence stage: workflow GITHUB_TOKEN stays
  # contents:read (never repo-wide contents:write); live pushes to ruleset-protected refs/heads/work-queue
  # require separate owner opt-in (vars.FACTORY_GHAW_PERSIST_ENABLED == 'true') and the gh-aw work-queue broker.
  safe-outputs-persist-journal:
    needs: [evaluate, threat-and-policy-scan]
    if: ${{ vars.FACTORY_GHAW_ENABLED == 'true' && vars.FACTORY_GHAW_PERSIST_ENABLED == 'true' && needs.evaluate.result == 'success' && needs.threat-and-policy-scan.result == 'success' && needs.threat-and-policy-scan.outputs.scan_verified == 'true' && needs.evaluate.outputs.handoff_sha256 != '' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected-branch workflow revision for CAS persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Download verified shadow journal handoff artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-work-queue-handoff
          path: ${{ runner.temp }}/factory-handoff
      - name: Persist journal snapshot to refs/heads/work-queue via non-force CAS
        env:
          EXPECTED_HANDOFF_SHA256: ${{ needs.evaluate.outputs.handoff_sha256 }}
          EXPECTED_WORK_QUEUE_OID: ${{ needs.evaluate.outputs.expected_work_queue_oid }}
        run: |
          set -euo pipefail
          HANDOFF_INPUT="${RUNNER_TEMP:-/tmp}/factory-handoff/factory-work-queue-handoff.json"
          STAGE_DIR="${RUNNER_TEMP:-/tmp}/factory-work-queue-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          export HANDOFF_INPUT STAGE_DIR
          node --input-type=module -e '
            import {readFileSync, writeFileSync} from "node:fs";
            import {join} from "node:path";
            import {verifyShadowJournalHandoff} from "./tools/engineering-factory/shadow-runtime.mjs";
            const raw = readFileSync(process.env.HANDOFF_INPUT, "utf8");
            const checked = verifyShadowJournalHandoff(
              raw,
              process.env.EXPECTED_HANDOFF_SHA256,
              process.env.EXPECTED_WORK_QUEUE_OID
            );
            if (!checked.ok) {
              console.error(JSON.stringify(checked));
              process.exit(1);
            }
            writeFileSync(join(process.env.STAGE_DIR, "event-journal-snapshot.json"), JSON.stringify(checked.snapshot), "utf8");
            writeFileSync(join(process.env.STAGE_DIR, "recovery-cursor.json"), JSON.stringify({schemaVersion: 1, pullCursor: checked.pullCursor}), "utf8");
          '
          ACTUAL_OID="0000000000000000000000000000000000000000"
          if git fetch --quiet --no-tags --depth=1 origin refs/heads/work-queue 2>/dev/null; then
            ACTUAL_OID="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$ACTUAL_OID" != "$EXPECTED_WORK_QUEUE_OID" ]; then
            echo "::error::CAS conflict on refs/heads/work-queue (expected $EXPECTED_WORK_QUEUE_OID, actual $ACTUAL_OID)"
            exit 1
          fi
          SNAP_BLOB="$(git hash-object -w "$STAGE_DIR/event-journal-snapshot.json")"
          CURSOR_BLOB="$(git hash-object -w "$STAGE_DIR/recovery-cursor.json")"
          STATE_TREE="$(printf '100644 blob %s\tevent-journal-snapshot.json\n100644 blob %s\trecovery-cursor.json\n' "$SNAP_BLOB" "$CURSOR_BLOB" | git mktree)"
          ROOT_TREE="$(printf '040000 tree %s\tstate\n' "$STATE_TREE" | git mktree)"
          export GIT_AUTHOR_NAME="softwarefactory-work-queue"
          export GIT_AUTHOR_EMAIL="work-queue@users.noreply.github.com"
          export GIT_COMMITTER_NAME="softwarefactory-work-queue"
          export GIT_COMMITTER_EMAIL="work-queue@users.noreply.github.com"
          if [ "$EXPECTED_WORK_QUEUE_OID" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_OID="$(git commit-tree "$ROOT_TREE" -m "chore(work-queue): persist shadow journal snapshot")"
          else
            COMMIT_OID="$(git commit-tree "$ROOT_TREE" -p "$EXPECTED_WORK_QUEUE_OID" -m "chore(work-queue): persist shadow journal snapshot")"
          fi
          git push --porcelain origin "$COMMIT_OID:refs/heads/work-queue"
