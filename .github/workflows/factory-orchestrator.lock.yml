# gh-aw-metadata: {"schema_version":"v4","frontmatter_hash":"8c060a69cb77578d642d76c97de21c75d5790e22716aa4321f46219ff4df219d","body_hash":"5b40aece16871c16d19ef10c4d5af0a372425405a5dcfcec2984d12800623ff1","compiler_version":"v1.2.2","strict":true,"agent_id":"copilot"}
# gh-aw-manifest: {"version":1,"secrets":[],"actions":[{"repo":"actions/checkout","sha":"3d3c42e5aac5ba805825da76410c181273ba90b1","version":"v7.0.1"},{"repo":"actions/setup-node","sha":"949feb2413d6458794dcd2491c4babbbce0c15c1","version":"v7.1.0"}]}
# gh-aw-commit: 399a445fe2d8926c616b54b1b82a16b5b2be4445
# gh-aw-work-queue-protocol: v3

name: Factory gh-aw outer orchestrator
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number for read-only dry-run evaluation
        required: false
        type: string
        default: ''
      mode:
        description: Orchestrator execution mode (shadow reconciliation, synthetic smoke, or lock verification)
        required: false
        type: choice
        default: shadow
        options:
          - shadow
          - smoke
          - verify-lock
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: ["Factory validation", "Windows Aspire runtime", ".NET MAF specialist agents"]
    types: [completed]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-ghaw-orchestrator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ vars.FACTORY_GHAW_ENABLED == 'true' && github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715' && github.ref == 'refs/heads/main' && github.ref_protected == true && !endsWith(github.actor, '[bot]') && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.id == 1471342715) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected-branch workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify gh-aw workflow lock and execute shadow evaluation
        env:
          FACTORY_GHAW_ENABLED: ${{ vars.FACTORY_GHAW_ENABLED }}
          FACTORY_GHAW_MODE: ${{ inputs.mode || 'shadow' }}
          FACTORY_EXPECTED_WORKFLOW_PATH: .github/workflows/factory-orchestrator.lock.yml
          FACTORY_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '' }}
          FACTORY_PULL_NUMBER: ${{ github.event.pull_request.number || '' }}
          FACTORY_PULL_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          FACTORY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          FACTORY_CHECK_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
          FACTORY_WORKFLOW_HEAD_REPO_ID: ${{ github.event.workflow_run.head_repository.id || '' }}
          FACTORY_MAIN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$FACTORY_GHAW_ENABLED" = true
          test "$GITHUB_REPOSITORY" = Jamula/SoftwareFactory
          test "$GITHUB_REPOSITORY_ID" = 1471342715
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_WORKFLOW_REF" = Jamula/SoftwareFactory/.github/workflows/factory-orchestrator.lock.yml@refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$FACTORY_WORKFLOW_HEAD_REPO_ID" = 1471342715
          fi
          FACTORY_GHAW_MODE="${FACTORY_GHAW_MODE:-shadow}"
          case "$FACTORY_GHAW_MODE" in
            shadow|smoke|verify-lock) ;;
            *) echo "::error::Unsupported orchestrator mode"; exit 1 ;;
          esac
          if [ -n "$FACTORY_ISSUE_NUMBER" ] && ! printf '%s' "$FACTORY_ISSUE_NUMBER" | grep -Eq '^[1-9][0-9]{0,9}$'; then
            echo "::error::Invalid issue_number input"
            exit 1
          fi
          for numeric_id in "$FACTORY_PULL_NUMBER" "$FACTORY_WORKFLOW_RUN_ID"; do
            if [ -n "$numeric_id" ] && ! printf '%s' "$numeric_id" | grep -Eq '^[1-9][0-9]{0,15}$'; then
              echo "::error::Invalid numeric event identifier"
              exit 1
            fi
          done
          for commit_sha in "$GITHUB_WORKFLOW_SHA" "$FACTORY_PULL_HEAD" "$FACTORY_CHECK_HEAD" "$FACTORY_MAIN_HEAD"; do
            if [ -n "$commit_sha" ] && ! printf '%s' "$commit_sha" | grep -Eq '^[a-f0-9]{40}$'; then
              echo "::error::Invalid event commit SHA"
              exit 1
            fi
          done
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {verifyEventTriggerMatrix, verifyGhAwWorkflowLock} from "./tools/engineering-factory/gh-aw-lock-verifier.mjs";
            const markdownSource = readFileSync(".github/workflows/factory-orchestrator.md", "utf8");
            const lockYamlSource = readFileSync(".github/workflows/factory-orchestrator.lock.yml", "utf8");
            const verdict = verifyGhAwWorkflowLock({markdownSource, lockYamlSource});
            const matrixVerdict = verifyEventTriggerMatrix(lockYamlSource);
            if (!verdict.valid || !matrixVerdict.valid) {
              console.error(JSON.stringify({verdict, matrixVerdict}));
              process.exit(1);
            }
            console.log(JSON.stringify({verdict, matrixVerdict}));
          '
          if [ "$FACTORY_GHAW_MODE" = smoke ]; then
            node tools/engineering-factory/run.mjs --smoke
          elif [ "$FACTORY_GHAW_MODE" = shadow ]; then
            case "$GITHUB_EVENT_NAME" in
              schedule|workflow_dispatch|issues|pull_request_target|workflow_run|push) ;;
              *) echo "::error::Unsupported orchestrator event"; exit 1 ;;
            esac
            node tools/engineering-factory/run.mjs --smoke
            test -n "$GITHUB_WORKFLOW_SHA"
            FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
            test "$FACTORY_CHECKOUT_SHA" = "$GITHUB_WORKFLOW_SHA"
            export FACTORY_CHECKOUT_SHA
            SNAPSHOT_WORK_FILE="${RUNNER_TEMP:-/tmp}/factory-event-journal-snapshot.json"
            if [ ! -s "$SNAPSHOT_WORK_FILE" ] && git fetch --quiet --no-tags --depth=1 origin refs/heads/work-queue 2>/dev/null; then
              git show FETCH_HEAD:state/event-journal-snapshot.json > "$SNAPSHOT_WORK_FILE" 2>/dev/null || rm -f "$SNAPSHOT_WORK_FILE"
            fi
            export SNAPSHOT_WORK_FILE
            node --input-type=module -e '
              import {existsSync, renameSync, statSync, writeFileSync, readFileSync} from "node:fs";
              import {reconcileShadowOrchestratorRun} from "./tools/engineering-factory/shadow-runtime.mjs";
              const snapPath = process.env.SNAPSHOT_WORK_FILE;
              let priorSnapshot;
              if (snapPath && existsSync(snapPath)) {
                const st = statSync(snapPath);
                if (st.size > 0) {
                  if (st.size > 2097152) process.exit(1);
                  priorSnapshot = JSON.parse(readFileSync(snapPath, "utf8"));
                }
              }
              const {snapshot, ...publicResult} = await reconcileShadowOrchestratorRun(
                process.env,
                priorSnapshot !== undefined ? {snapshot: priorSnapshot} : {}
              );
              if (publicResult.reason === "TRUST_UNKNOWN" || publicResult.reason === "INVALID_SNAPSHOT" || publicResult.reason === "LEASE_CONFLICT") {
                console.error(JSON.stringify(publicResult));
                process.exit(1);
              }
              if (snapshot && snapshot.exported && snapPath) {
                const tmpPath = `${snapPath}.tmp`;
                writeFileSync(tmpPath, JSON.stringify(snapshot), "utf8");
                renameSync(tmpPath, snapPath);
              }
              console.log(JSON.stringify(publicResult));
            '
          fi

  threat-and-policy-scan:
    needs: [evaluate]
    if: ${{ vars.FACTORY_GHAW_ENABLED == 'true' && needs.evaluate.result == 'success' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scan_verified: ${{ steps.policy_scan.outputs.scan_verified }}
    steps:
      - name: Checkout immutable protected-branch workflow revision for policy scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify non-mutation and protected-control-plane posture
        id: policy_scan
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {verifyEventTriggerMatrix, verifyGhAwWorkflowLock} from "./tools/engineering-factory/gh-aw-lock-verifier.mjs";
            const markdownSource = readFileSync(".github/workflows/factory-orchestrator.md", "utf8");
            const lockYamlSource = readFileSync(".github/workflows/factory-orchestrator.lock.yml", "utf8");
            const verdict = verifyGhAwWorkflowLock({markdownSource, lockYamlSource});
            const matrixVerdict = verifyEventTriggerMatrix(lockYamlSource);
            if (!verdict.valid || !matrixVerdict.valid || verdict.liveDispatch !== false || verdict.liveMerge !== false) {
              process.exit(1);
            }
          '
          echo "scan_verified=true" >> "$GITHUB_OUTPUT"

  safe-outputs-dry-run:
    needs: [evaluate, threat-and-policy-scan]
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Safe-outputs live mutations remain disabled pending separate authorization
        run: |
          set -euo pipefail
          echo "safe-outputs remain disabled until separate live authorization"
