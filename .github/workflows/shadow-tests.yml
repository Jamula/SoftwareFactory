name: Engineering factory shadow replay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pinned evaluator and synthetic replay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamula/SoftwareFactory
          ref: 1208481843e73d1d2506085c654e84255303541d
          path: softwarefactory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify Node.js runtime
        run: node --version
      - name: Run synthetic replay tests
        run: node --test tests/engineering-factory/core.test.mjs
        working-directory: softwarefactory
