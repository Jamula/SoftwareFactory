name: Engineering factory shadow replay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pinned evaluator and synthetic replay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Jamula/SoftwareFactory
          ref: 8492e707b296c16d08dc7e13b138cf0d9e2facc6
          path: softwarefactory
          persist-credentials: false
      - name: Verify Node.js runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Run synthetic replay tests
        run: node --test tests/engineering-factory/core.test.mjs
        working-directory: softwarefactory
