name: .NET MAF specialist agents
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dotnet-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux-dotnet-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false
      - name: Verify exact candidate head and pinned .NET SDK
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.404"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Candidate $EXPECTED_HEAD"
      - name: Restore and build .NET MAF agents and Aspire AppHost
        run: |
          set -euo pipefail
          dotnet restore tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --source https://api.nuget.org/v3/index.json
          dotnet build tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --configuration Release --no-restore
          dotnet restore apphost.cs --source https://api.nuget.org/v3/index.json
          dotnet build apphost.cs --configuration Release --no-restore
      - name: Run xUnit tests with Coverlet 98/95 coverage gate
        run: |
          set -euo pipefail
          coverage_file="$RUNNER_TEMP/dotnet-agents-coverage/cobertura.xml"
          dotnet test tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --configuration Release --no-build -p:CollectCoverage=true "-p:CoverletOutput=$coverage_file"
          test -s "$coverage_file"
      - name: Run synthetic MAF workflow smoke and benchmark CLI
        run: |
          set -euo pipefail
          smoke_json="$(dotnet run --project src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj --configuration Release --no-build -- --smoke)"
          printf '%s\n' "$smoke_json"
          printf '%s\n' "$smoke_json" | grep -Fq '"outcome":"eligible"'
          printf '%s\n' "$smoke_json" | grep -Fq '"priorSuperstepsRepeated":0'
          dotnet run --project src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj --configuration Release --no-build -- --benchmark >/dev/null

  windows-dotnet-agents:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false
      - name: Verify exact candidate head and pinned .NET SDK
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'SDK version mismatch' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Candidate mismatch' }
          Write-Host "Candidate $actual"
      - name: Restore and build .NET MAF agents and Aspire AppHost
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Agent test restore failed' }
          dotnet build tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Agent test build failed' }
          dotnet restore apphost.cs --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'AppHost restore failed' }
          dotnet build apphost.cs --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'AppHost build failed' }
      - name: Run xUnit tests with Coverlet 98/95 coverage gate
        run: |
          $ErrorActionPreference = 'Stop'
          $coverageFile = Join-Path $env:RUNNER_TEMP 'dotnet-agents-coverage\cobertura.xml'
          dotnet test tests/SoftwareFactory.Agents.Tests/SoftwareFactory.Agents.Tests.csproj --configuration Release --no-build "-p:CollectCoverage=true" "-p:CoverletOutput=$coverageFile"
          if ($LASTEXITCODE -ne 0) { throw 'xUnit or Coverlet 98/95 gate failed' }
          if (-not (Test-Path -LiteralPath $coverageFile)) { throw 'Missing Cobertura coverage output' }
      - name: Run synthetic MAF workflow smoke and benchmark CLI
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = (dotnet run --project src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj --configuration Release --no-build -- --smoke) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'MAF synthetic smoke failed' }
          Write-Host $smoke
          if (-not $smoke.Contains('"outcome":"eligible"') -or -not $smoke.Contains('"priorSuperstepsRepeated":0')) {
            throw 'Unexpected MAF smoke receipt'
          }
          $null = dotnet run --project src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj --configuration Release --no-build -- --benchmark
          if ($LASTEXITCODE -ne 0) { throw 'MAF benchmark failed' }
