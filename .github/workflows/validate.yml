name: Factory validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify pinned candidate before testing
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Candidate $EXPECTED_HEAD"
      - name: Runnable synthetic factory
        run: node tools/engineering-factory/run.mjs --smoke
      - name: Restore locked npm cache (read-only)
        id: npm-cache-restore
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: sf-npm-ci-v1-${{ runner.os }}-${{ runner.arch }}-node-26.13.1-ignore-scripts-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Restore and save locked npm cache (protected main)
        id: npm-cache-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: sf-npm-ci-v1-${{ runner.os }}-${{ runner.arch }}-node-26.13.1-ignore-scripts-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install locked dependencies
        env:
          NPM_CACHE_HIT: ${{ steps.npm-cache-restore.outputs.cache-hit || steps.npm-cache-main.outputs.cache-hit || 'false' }}
        run: |
          set -euo pipefail
          npm_start="$(date +%s%3N)"
          NPM_CONFIG_CACHE="$HOME/.npm" npm ci --ignore-scripts
          npm_end="$(date +%s%3N)"
          npm_hit="false"
          if [ "${NPM_CACHE_HIT:-false}" = "true" ]; then
            npm_hit="true"
          fi
          printf 'validate stage timing: job=test-coverage npm_cache_hit=%s npm_ci_ms=%s\n' "$npm_hit" "$((npm_end - npm_start))"
      # One full test execution; the exact-head reporter independently enumerates
      # every tracked source component and rejects any missing or sub-98/95 row.
      - name: Full test suite and exact-source component coverage (98/95)
        env:
          FACTORY_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -f coverage-evidence.json cobertura-coverage.xml
          npm run test:coverage
          test -s coverage-evidence.json
          test -s cobertura-coverage.xml
          cat coverage-evidence.json
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-javascript
          path: cobertura-coverage.xml
          if-no-files-found: error

  linux-aspire-runtime:
    # Fork PRs cannot satisfy the full trusted platform gate; protected merge
    # groups and main MUST execute runtime validation, not merely build it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Verify pinned candidate before testing
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Candidate $EXPECTED_HEAD"
      - name: Restore locked npm cache (read-only)
        id: npm-cache-restore
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: sf-npm-ci-v1-${{ runner.os }}-${{ runner.arch }}-node-26.13.1-ignore-scripts-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Restore and save locked npm cache (protected main)
        id: npm-cache-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: sf-npm-ci-v1-${{ runner.os }}-${{ runner.arch }}-node-26.13.1-ignore-scripts-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install locked dependencies for runtime
        env:
          NPM_CACHE_HIT: ${{ steps.npm-cache-restore.outputs.cache-hit || steps.npm-cache-main.outputs.cache-hit || 'false' }}
        run: |
          set -euo pipefail
          npm_start="$(date +%s%3N)"
          NPM_CONFIG_CACHE="$HOME/.npm" npm ci --ignore-scripts
          npm_end="$(date +%s%3N)"
          npm_hit="false"
          if [ "${NPM_CACHE_HIT:-false}" = "true" ]; then
            npm_hit="true"
          fi
          printf 'validate stage timing: job=linux-aspire-runtime npm_cache_hit=%s npm_ci_ms=%s\n' "$npm_hit" "$((npm_end - npm_start))"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false
      - name: Restore locked NuGet and Aspire.Cli cache (read-only)
        id: aspire-cache-restore
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nuget-packages
            ${{ runner.temp }}/aspire-cli-feed
          key: sf-aspire-nuget-v2-${{ runner.os }}-${{ runner.arch }}-dotnet-10.0.404-aspire-17.0.0-release-${{ hashFiles('global.json', 'apphost.cs', 'src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj', '**/packages.lock.json', 'Directory.Build.props', 'Directory.Packages.props') }}
      - name: Restore and save locked NuGet and Aspire.Cli cache (protected main)
        id: aspire-cache-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nuget-packages
            ${{ runner.temp }}/aspire-cli-feed
          key: sf-aspire-nuget-v2-${{ runner.os }}-${{ runner.arch }}-dotnet-10.0.404-aspire-17.0.0-release-${{ hashFiles('global.json', 'apphost.cs', 'src/SoftwareFactory.Agents/SoftwareFactory.Agents.csproj', '**/packages.lock.json', 'Directory.Build.props', 'Directory.Packages.props') }}
      - name: Restore and build the pinned Aspire AppHost
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          ASPIRE_CACHE_HIT: ${{ steps.aspire-cache-restore.outputs.cache-hit || steps.aspire-cache-main.outputs.cache-hit || 'false' }}
        run: |
          set -euo pipefail
          stage_start="$(date +%s%3N)"
          sdk_version="$(dotnet --version)"
          test "$sdk_version" = 10.0.404
          tool_dir="$RUNNER_TEMP/softwarefactory-aspire-tools"
          feed_dir="$RUNNER_TEMP/aspire-cli-feed"
          export ASPIRE_HOME="$RUNNER_TEMP/softwarefactory-aspire"
          rm -rf -- "$tool_dir"
          verify_aspire_feed() {
            [ -d "$feed_dir" ] && [ ! -L "$feed_dir" ] || return 1
            [ "$(find "$feed_dir" -mindepth 1 | wc -l | tr -d ' ')" = "2" ] || return 1
            [ -f "$feed_dir/aspire.cli.17.0.0.nupkg" ] && [ ! -L "$feed_dir/aspire.cli.17.0.0.nupkg" ] || return 1
            [ -f "$feed_dir/aspire.cli.linux-x64.17.0.0.nupkg" ] && [ ! -L "$feed_dir/aspire.cli.linux-x64.17.0.0.nupkg" ] || return 1
            printf '%s  %s\n%s  %s\n' \
              "31599e3906c24c5b05787651ac52859ca0e267973ff2bb9f38ca5f968e355f1d" "$feed_dir/aspire.cli.17.0.0.nupkg" \
              "e82a0663bc83b4cccd1c23403baa45eef2141a889e84f97030e50c21f3f5781f" "$feed_dir/aspire.cli.linux-x64.17.0.0.nupkg" | sha256sum -c - >/dev/null 2>&1
          }
          aspire_reused="false"
          if verify_aspire_feed; then
            dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$tool_dir" --source "$feed_dir"
            aspire_reused="true"
          else
            rm -rf -- "$feed_dir"
            dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$tool_dir" --source https://api.nuget.org/v3/index.json
            mkdir -p "$feed_dir"
            cp -f "$tool_dir/.store/aspire.cli/17.0.0/aspire.cli/17.0.0/aspire.cli.17.0.0.nupkg" "$feed_dir/aspire.cli.17.0.0.nupkg"
            cp -f "$tool_dir/.store/aspire.cli/17.0.0/aspire.cli.linux-x64/17.0.0/aspire.cli.linux-x64.17.0.0.nupkg" "$feed_dir/aspire.cli.linux-x64.17.0.0.nupkg"
            verify_aspire_feed
          fi
          export PATH="$tool_dir:$PATH"
          verified_aspire="$(aspire --version)"
          case "$verified_aspire" in
            17.0.0|17.0.0+*) ;;
            *) echo "::error::Unexpected Aspire.Cli version"; exit 1 ;;
          esac
          dotnet restore apphost.cs --source https://api.nuget.org/v3/index.json
          dotnet build apphost.cs --configuration Release --no-restore
          stage_end="$(date +%s%3N)"
          cache_hit="false"
          if [ "${ASPIRE_CACHE_HIT:-false}" = "true" ]; then
            cache_hit="true"
          fi
          printf 'validate stage timing: job=linux-aspire-runtime aspire_cache_hit=%s aspire_cli_reused=%s restore_build_ms=%s\n' "$cache_hit" "$aspire_reused" "$((stage_end - stage_start))"
      - name: Exercise the isolated Aspire AppHost
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
          ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: 'true'
          ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'false'
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'false'
          ASPIRE_CLI_START_TIMEOUT: '60'
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          set -euo pipefail
          export ASPIRE_HOME="$RUNNER_TEMP/softwarefactory-aspire"
          export PATH="$RUNNER_TEMP/softwarefactory-aspire-tools:$PATH"
          umask 077
          output="$(mktemp "$RUNNER_TEMP/softwarefactory-aspire-smoke.XXXXXXXX")"
          certificate="$output.pem"
          archive="$output.zip"
          data_root="$(mktemp -d "$RUNNER_TEMP/softwarefactory-aspire-data.XXXXXXXX")"
          export ASPIRE_DASHBOARD_DATA_DIRECTORY="$data_root"
          export ASPIRE_DASHBOARD_PERSISTENCE_MODE=Run
          cleanup() {
            timeout 30s aspire stop --apphost apphost.cs --non-interactive >/dev/null 2>&1 || true
            rm -f -- "$output" "$certificate" "$archive"
            rm -rf -- "$data_root"
          }
          trap cleanup EXIT
          dotnet dev-certs https --export-path "$certificate" --format PEM >"$output" 2>&1
          export NODE_EXTRA_CA_CERTS="$certificate"
          export ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL="https://127.0.0.1:18890"
          if ! timeout 120s aspire start --apphost apphost.cs --isolated --non-interactive --nologo >"$output" 2>&1; then
            echo "::error::Isolated Aspire startup failed"
            exit 1
          fi
          if ! grep -Eq 'https://(localhost|127\.0\.0\.1|\[::1\]):[0-9]+/login\?t=[^[:space:]]+' "$output"; then
            echo "::error::Aspire did not report a loopback HTTPS dashboard login"
            exit 1
          fi
          echo "Aspire reported a loopback HTTPS dashboard login"
          dashboard="$(grep -Eom1 'https://(localhost|127\.0\.0\.1|\[::1\]):[0-9]+/login\?t=' "$output")"
          origin="$(printf '%s\n' "$dashboard" | cut -d/ -f1-3)"
          if ! challenge="$(curl --silent --show-error --noproxy '*' --max-time 10 --cacert "$certificate" \
                  --output /dev/null --write-out '%{http_code} %{redirect_url}' "$origin/resources" 2>"$output")"; then
            echo "::error::Could not verify the dashboard over trusted loopback TLS"
            exit 1
          fi
          case "$challenge" in
            "302 $origin/login"|"302 $origin/login?"*) echo "Dashboard required login for an unauthenticated HTTPS request" ;;
            *) echo "::error::Unauthenticated dashboard request did not require login"; exit 1 ;;
          esac
          if ! timeout 30s aspire resource synthetic-shadow start --apphost apphost.cs --non-interactive >"$output" 2>&1; then
            echo "::error::Synthetic resource could not be started"
            exit 1
          fi
          if ! timeout 30s aspire wait synthetic-shadow --status down --timeout 20 --apphost apphost.cs >"$output" 2>&1; then
            echo "::error::Synthetic resource did not exit"
            exit 1
          fi
          if ! timeout 20s aspire logs synthetic-shadow --apphost apphost.cs --non-interactive >"$output" 2>&1 ||
             ! grep -Fq '{"scenario":"local-synthetic-stop","state":"blocked","reason":"STOPPED","shadow":true}' "$output"; then
            echo "::error::Expected synthetic STOPPED result was not observed"
            exit 1
          fi
          if ! grep -Eq '(^|[[:space:]])LOCAL_SDK_SHUTDOWN_COMPLETE[[:space:]]*$' "$output"; then
            echo "::error::SDK shutdown completion was not observed"
            exit 1
          fi
          echo "Synthetic resource emitted STOPPED, completed SDK shutdown and exited"
          if ! timeout 30s aspire export --apphost apphost.cs --output "$archive" --non-interactive >"$output" 2>&1; then
            echo "::error::Dashboard export failed"
            exit 1
          fi
          node tools/engineering-factory/verify-dashboard-export.mjs "$archive"
          if ! timeout 30s aspire stop --apphost apphost.cs --non-interactive >"$output" 2>&1; then
            echo "::error::Aspire shutdown failed"
            exit 1
          fi
          node tools/engineering-factory/verify-dashboard-metric-receipt.mjs "$data_root"
          trap - EXIT
          rm -f -- "$output" "$certificate" "$archive"
          rm -rf -- "$data_root"
          echo "Isolated AppHost stopped"

  # Preserve the existing required check context. Neither a failed nor skipped
  # dependency may be reported as successful aggregate validation.
  build-test:
    needs: [test-coverage, linux-aspire-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both independent validation jobs
        env:
          TEST_RESULT: ${{ needs.test-coverage.result }}
          RUNTIME_RESULT: ${{ needs.linux-aspire-runtime.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$RUNTIME_RESULT" = success

  upload-coverage-javascript:
    needs: test-coverage
    if: ${{ !cancelled() && needs.test-coverage.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-javascript
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent
