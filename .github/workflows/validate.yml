name: Factory validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Exact candidate replay and source coverage
        run: |
          node --version
          git rev-parse HEAD
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/core.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/core.test.mjs

      - name: Shadow runtime coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/shadow-runtime.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/shadow-runtime.test.mjs
      - name: CLI source coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/run.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/shadow-runtime.test.mjs
      - name: Per-component coverage gates (consolidated)
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/budget.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/budget.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/telemetry.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/telemetry.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/review-history.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/review-history.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/contract-routing.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/contract-routing.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/event-envelope.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/event-envelope.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/lease-transition.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/lease-transition.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/integration-train.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/integration-train.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/validation-diagnosis.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/validation-diagnosis.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/stage-aggregate.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/stage-aggregate.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/coverage-evidence.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/coverage-evidence.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/dispatch-intent.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/dispatch-intent.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/pilot-readiness.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/pilot-readiness.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/queue-inspection.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/queue-inspection.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/stage-latency.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-factory/stage-latency.test.mjs
      - name: Engineering Coordinator component coverage gates
        run: |
          set -euo pipefail
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/project-config.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/project-config.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/planner.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/planner.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/retry.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/retry.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/provider-adapters.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/provider-adapters.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/sqlite-state-store.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/sqlite-state-store.test.mjs
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-coordinator/coordinator.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tests/engineering-coordinator/coordinator.test.mjs
      - name: Aspire headless synthetic runner
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/aspire-smoke.mjs' --test-coverage-lines=98 --test-coverage-branches=95 tools/engineering-factory/aspire-smoke.mjs
      - name: Runnable synthetic factory
        run: node tools/engineering-factory/run.mjs --smoke
      - name: Install locked coverage reporter
        run: npm ci --ignore-scripts
      - name: Overall source coverage and Cobertura report
        run: npm run test:coverage
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false
      - name: Restore and build the pinned Aspire AppHost
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
        run: |
          set -euo pipefail
          sdk_version="$(dotnet --version)"
          test "$sdk_version" = 10.0.404
          tool_dir="$RUNNER_TEMP/softwarefactory-aspire-tools"
          export ASPIRE_HOME="$RUNNER_TEMP/softwarefactory-aspire"
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$tool_dir" --source https://api.nuget.org/v3/index.json
          export PATH="$tool_dir:$PATH"
          aspire --version
          dotnet restore apphost.cs --source https://api.nuget.org/v3/index.json
          dotnet build apphost.cs --configuration Release --no-restore
      - name: Exercise the isolated Aspire AppHost
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
          ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: 'true'
          ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'false'
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'false'
          ASPIRE_CLI_START_TIMEOUT: '60'
        run: |
          set -euo pipefail
          export ASPIRE_HOME="$RUNNER_TEMP/softwarefactory-aspire"
          export PATH="$RUNNER_TEMP/softwarefactory-aspire-tools:$PATH"
          umask 077
          output="$(mktemp "$RUNNER_TEMP/softwarefactory-aspire-smoke.XXXXXXXX")"
          cleanup() {
            timeout 30s aspire stop --apphost apphost.cs --non-interactive >/dev/null 2>&1 || true
            rm -f -- "$output"
          }
          trap cleanup EXIT
          if ! timeout 120s aspire start --apphost apphost.cs --isolated --non-interactive --nologo >"$output" 2>&1; then
            echo "::error::Isolated Aspire startup failed"
            exit 1
          fi
          if ! grep -Eq 'https://(localhost|127\.0\.0\.1|\[::1\]):[0-9]+/login\?t=[^[:space:]]+' "$output"; then
            echo "::error::Aspire did not report a loopback HTTPS dashboard login"
            exit 1
          fi
          echo "Aspire reported a loopback HTTPS dashboard login"
          if ! timeout 30s aspire resource synthetic-shadow start --apphost apphost.cs --non-interactive >"$output" 2>&1; then
            echo "::error::Synthetic resource could not be started"
            exit 1
          fi
          if ! timeout 30s aspire wait synthetic-shadow --status down --timeout 20 --apphost apphost.cs >"$output" 2>&1; then
            echo "::error::Synthetic resource did not exit"
            exit 1
          fi
          if ! timeout 20s aspire logs synthetic-shadow --apphost apphost.cs --non-interactive >"$output" 2>&1 ||
             ! grep -Fq '{"scenario":"local-synthetic-stop","state":"blocked","reason":"STOPPED","shadow":true}' "$output"; then
            echo "::error::Expected synthetic STOPPED result was not observed"
            exit 1
          fi
          echo "Synthetic resource emitted STOPPED and exited"
          if ! timeout 30s aspire stop --apphost apphost.cs --non-interactive >"$output" 2>&1; then
            echo "::error::Aspire shutdown failed"
            exit 1
          fi
          trap - EXIT
          rm -f -- "$output"
          echo "Isolated AppHost stopped"
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-javascript
          path: cobertura-coverage.xml

  upload-coverage-javascript:
    needs: build-test
    if: ${{ !cancelled() && needs.build-test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-javascript
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent
