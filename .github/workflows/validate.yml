name: Factory validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Exact candidate replay and source coverage
        run: |
          node --version
          git rev-parse HEAD
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/core.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/core.test.mjs

      - name: Shadow runtime coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/shadow-runtime.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/shadow-runtime.test.mjs
      - name: CLI source coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/run.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/shadow-runtime.test.mjs
      - name: Runnable synthetic factory
        run: node tools/engineering-factory/run.mjs --smoke
      - name: Install locked coverage reporter
        run: npm ci --ignore-scripts
      - name: Overall source coverage and Cobertura report
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-javascript
          path: cobertura-coverage.xml

  upload-coverage-javascript:
    needs: build-test
    if: ${{ !cancelled() && needs.build-test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-javascript
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent
