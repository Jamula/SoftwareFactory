name: Factory validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Exact candidate replay and source coverage
        run: |
          node --version
          git rev-parse HEAD
          node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/core.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/*.test.mjs

      - name: Shadow runtime coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/shadow-runtime.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/shadow-runtime.test.mjs
      - name: CLI source coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/run.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/shadow-runtime.test.mjs
      - name: Overall source coverage
        run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/*.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/*.test.mjs
      - name: Runnable synthetic factory
        run: node tools/engineering-factory/run.mjs --smoke
