name: Windows Aspire runtime
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows-aspire-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: 'true'
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'false'
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'false'
      ASPIRE_CLI_START_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
          cache: false
      - name: Verify exact head and pinned runtime
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Candidate mismatch' }
          Write-Host "Candidate $actual"
          if ((node --version).Trim() -ne 'v26.13.1') { throw 'Node version mismatch' }
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'SDK version mismatch' }
          node tools/engineering-factory/aspire-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic smoke failed' }
      - name: Restore locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Restore pinned Aspire
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ASPIRE_HOME = Join-Path $env:RUNNER_TEMP 'softwarefactory-aspire'
          $toolDir = Join-Path $env:RUNNER_TEMP 'softwarefactory-aspire-tools'
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path $toolDir --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Aspire install failed' }
          Add-Content -Path $env:GITHUB_PATH -Value $toolDir
          Add-Content -Path $env:GITHUB_ENV -Value "ASPIRE_HOME=$env:ASPIRE_HOME"
          dotnet restore apphost.cs --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build apphost.cs --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Exercise isolated authenticated AppHost
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP ('aspire-smoke-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $out = Join-Path $tmp 'out.txt'
          $err = Join-Path $tmp 'err.txt'
          $cert = Join-Path $tmp 'dev.pem'
          function Invoke-Aspire([string[]]$arguments, [int]$seconds) {
            $p = Start-Process -FilePath (Get-Command aspire -ErrorAction Stop).Source -ArgumentList $arguments -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) {
              try { $p.Kill($true) } catch { }
              throw 'Aspire command timed out'
            }
            if ($p.ExitCode -ne 0) { throw 'Aspire command failed' }
            Get-Content -Raw $out
          }
          try {
            $null = & dotnet dev-certs https --export-path $cert --format PEM 2>&1
            if ($LASTEXITCODE -ne 0) { throw 'Certificate export failed' }
            $env:NODE_EXTRA_CA_CERTS = $cert
            $env:ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL = 'https://127.0.0.1:18890'
            $startup = Invoke-Aspire @('start','--apphost','apphost.cs','--isolated','--non-interactive','--nologo') 120
            $login = [regex]::Match($startup,'https://(?:localhost|127\.0\.0\.1|\[::1\]):[0-9]+/login\?t=[^\s]+')
            if (-not $login.Success) { throw 'No authenticated loopback HTTPS dashboard' }
            $origin = ([uri]$login.Value).GetLeftPart([System.UriPartial]::Authority)
            $challenge = & curl.exe --silent --noproxy '*' --max-time 10 --cacert $cert --output NUL --write-out '%{http_code} %{redirect_url}' "$origin/resources" 2>$err
            if ($LASTEXITCODE -ne 0 -or ($challenge -ne "302 $origin/login" -and -not $challenge.StartsWith("302 $origin/login?"))) { throw 'Dashboard did not require login over trusted TLS' }
            Write-Host 'Dashboard required login over loopback HTTPS'
            $null = Invoke-Aspire @('resource','synthetic-shadow','start','--apphost','apphost.cs','--non-interactive') 30
            $null = Invoke-Aspire @('wait','synthetic-shadow','--status','down','--timeout','20','--apphost','apphost.cs') 30
            $logs = Invoke-Aspire @('logs','synthetic-shadow','--apphost','apphost.cs','--non-interactive') 20
            if (-not $logs.Contains('{"scenario":"local-synthetic-stop","state":"blocked","reason":"STOPPED","shadow":true}')) { throw 'STOPPED fixture missing' }
            if ($logs -notmatch '(?m)(^|\s)LOCAL_SDK_SHUTDOWN_COMPLETE[ \t\r]*$') { throw 'SDK shutdown completion missing' }
            Write-Host 'Synthetic resource emitted STOPPED, completed SDK shutdown and exited'
            $null = Invoke-Aspire @('stop','--apphost','apphost.cs','--non-interactive') 30
            Write-Host 'Isolated Windows AppHost stopped'
          } finally {
            try { $null = Invoke-Aspire @('stop','--apphost','apphost.cs','--non-interactive') 30 } catch { }
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          }
