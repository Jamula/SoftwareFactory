name: Reusable replay smoke
on:
  # The exact candidate evaluator is tested by Factory validation on every PR.
  # The immutable consumer replay is separately exercised when its contract,
  # runtime, or workflow configuration changes, and on every merge group/main.
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/engineering-factory/core.mjs'
      - 'tests/engineering-factory/core.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.nvmrc'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reusable-replay-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pinned-synthetic-replay:
    uses: Jamula/SoftwareFactory/.github/workflows/shadow-tests.yml@afc3d223f287b029db32672908097efc67a259c9
