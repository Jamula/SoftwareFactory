name: Factory shadow reconciliation
on:
  workflow_dispatch:
  # Best-effort recovery inventory; primary triggers remain event-driven.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Factory validation", "Windows Aspire runtime"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: factory-shadow-reconcile
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.repository == 'Jamula/SoftwareFactory' && vars.FACTORY_SHADOW_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check case-sensitive opt-in before checkout
        id: optin
        shell: bash
        env:
          FACTORY_SHADOW_ENABLED: ${{ vars.FACTORY_SHADOW_ENABLED }}
          FACTORY_PULL_EVENT_SHADOW_ENABLED: ${{ vars.FACTORY_PULL_EVENT_SHADOW_ENABLED }}
        run: |
          if [[ "$FACTORY_SHADOW_ENABLED" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == pull_request_target && "$FACTORY_PULL_EVENT_SHADOW_ENABLED" == true ]]; then
              echo "pull_enabled=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Never check out a PR head, consume artifacts, or evaluate event text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.optin.outputs.enabled == 'true'
        with:
          ref: ${{ steps.optin.outputs.pull_enabled == 'true' && github.workflow_sha || 'refs/heads/main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.optin.outputs.enabled == 'true'
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Record trusted checkout and bounded public metadata inventory
        if: steps.optin.outputs.enabled == 'true'
        run: |
          git rev-parse HEAD
          node tools/engineering-factory/run.mjs --inventory
      - name: Reconcile the triggering PR against public metadata
        if: steps.optin.outputs.pull_enabled == 'true'
        env:
          FACTORY_PULL_NUMBER: ${{ github.event.number }}
          FACTORY_PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export FACTORY_CHECKOUT_SHA
          node tools/engineering-factory/run.mjs --reconcile-pull
