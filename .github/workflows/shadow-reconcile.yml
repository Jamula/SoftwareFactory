name: Factory shadow reconciliation
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number for a read-only manual reconciliation
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  inventory:
    if: ${{ github.repository == 'Jamula/SoftwareFactory' && github.repository_id == '1471342715' && github.ref == 'refs/heads/main' && github.ref_protected == true && vars.FACTORY_SHADOW_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.id == 1471342715) }}
    concurrency:
      group: factory-shadow-reconcile
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check case-sensitive opt-in before checkout
        id: optin
        shell: bash
        env:
          FACTORY_SHADOW_ENABLED: ${{ vars.FACTORY_SHADOW_ENABLED }}
          FACTORY_PULL_EVENT_SHADOW_ENABLED: ${{ vars.FACTORY_PULL_EVENT_SHADOW_ENABLED }}
          FACTORY_ISSUE_EVENT_SHADOW_ENABLED: ${{ vars.FACTORY_ISSUE_EVENT_SHADOW_ENABLED }}
          FACTORY_CHECK_EVENT_SHADOW_ENABLED: ${{ vars.FACTORY_CHECK_EVENT_SHADOW_ENABLED }}
          FACTORY_MAIN_EVENT_SHADOW_ENABLED: ${{ vars.FACTORY_MAIN_EVENT_SHADOW_ENABLED }}
          FACTORY_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '' }}
          FACTORY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          # GitHub expression comparisons are case-insensitive. Verify the actual
          # repository identity and protected ref before enabling any checkout or execution.
          if [[ "$FACTORY_SHADOW_ENABLED" == true && "$GITHUB_REPOSITORY" == Jamula/SoftwareFactory && "$GITHUB_REPOSITORY_ID" == 1471342715 && "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == pull_request_target && "$FACTORY_PULL_EVENT_SHADOW_ENABLED" == true ]]; then
              echo "pull_enabled=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$GITHUB_EVENT_NAME" == issues && "$FACTORY_ISSUE_EVENT_SHADOW_ENABLED" == true ]]; then
              echo "issue_enabled=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$FACTORY_ISSUE_EVENT_SHADOW_ENABLED" == true && -n "$FACTORY_ISSUE_NUMBER" ]]; then
              echo "issue_enabled=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$FACTORY_CHECK_EVENT_SHADOW_ENABLED" == true && -n "$FACTORY_WORKFLOW_RUN_ID" ]]; then
              echo "check_enabled=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$GITHUB_EVENT_NAME" == push && "$FACTORY_MAIN_EVENT_SHADOW_ENABLED" == true ]]; then
              echo "main_enabled=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Never check out a PR head, consume artifacts, or evaluate event text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.optin.outputs.enabled == 'true'
        with:
          ref: ${{ (steps.optin.outputs.pull_enabled == 'true' || steps.optin.outputs.issue_enabled == 'true' || steps.optin.outputs.check_enabled == 'true' || steps.optin.outputs.main_enabled == 'true') && github.workflow_sha || 'refs/heads/main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.optin.outputs.enabled == 'true'
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Record trusted checkout and bounded public metadata inventory
        if: steps.optin.outputs.enabled == 'true'
        run: |
          git rev-parse HEAD
          node tools/engineering-factory/run.mjs --inventory
      - name: Reconcile the triggering PR against public metadata
        if: steps.optin.outputs.pull_enabled == 'true'
        env:
          FACTORY_PULL_NUMBER: ${{ github.event.number }}
          FACTORY_PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export FACTORY_CHECKOUT_SHA
          node tools/engineering-factory/run.mjs --reconcile-pull
      - name: Reconcile the triggering or manually selected issue against public metadata
        if: steps.optin.outputs.issue_enabled == 'true'
        env:
          FACTORY_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '' }}
        shell: bash
        run: |
          FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export FACTORY_CHECKOUT_SHA
          node tools/engineering-factory/run.mjs --reconcile-issue
      - name: Reconcile the completed workflow run against public metadata
        if: steps.optin.outputs.check_enabled == 'true'
        env:
          FACTORY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          FACTORY_CHECK_HEAD: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export FACTORY_CHECKOUT_SHA
          node --input-type=module -e 'import {reconcileEventTrigger} from "./tools/engineering-factory/event-envelope.mjs"; const r = await reconcileEventTrigger(process.env); delete r.snapshot; console.log(JSON.stringify(r));'
      - name: Reconcile the protected main push against public metadata
        if: steps.optin.outputs.main_enabled == 'true'
        env:
          FACTORY_MAIN_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          FACTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export FACTORY_CHECKOUT_SHA
          node --input-type=module -e 'import {reconcileEventTrigger} from "./tools/engineering-factory/event-envelope.mjs"; const r = await reconcileEventTrigger(process.env); delete r.snapshot; console.log(JSON.stringify(r));'
