name: telemetry component validation
on: [pull_request]
permissions:
  contents: read
jobs:
  telemetry-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - run: node --test --experimental-test-coverage --test-coverage-include='tools/engineering-factory/telemetry.mjs' --test-coverage-lines=95 --test-coverage-branches=90 tests/engineering-factory/telemetry.test.mjs
