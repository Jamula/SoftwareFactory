name: Factory Copilot hosted pilot
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: factory-copilot-hosted-pilot
  cancel-in-progress: false
jobs:
  pilot:
    # This coarse expression is not a trust boundary. Verify the case-sensitive
    # repository/ref/protection and opt-in again before any credential is used.
    if: github.repository == 'Jamula/SoftwareFactory' && github.ref == 'refs/heads/main' && vars.FACTORY_COPILOT_PILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: factory-copilot-pilot
    steps:
      - name: Verify owner-approved protected-main pilot
        shell: bash
        env:
          FACTORY_COPILOT_PILOT_ENABLED: ${{ vars.FACTORY_COPILOT_PILOT_ENABLED }}
          FACTORY_COPILOT_INCLUDED_ONLY_CONFIRMED: ${{ vars.FACTORY_COPILOT_INCLUDED_ONLY_CONFIRMED }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Jamula/SoftwareFactory ]]
          [[ "$GITHUB_REPOSITORY_ID" == 1471342715 ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_WORKFLOW_REF" == 'Jamula/SoftwareFactory/.github/workflows/copilot-hosted-pilot.yml@refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$FACTORY_COPILOT_PILOT_ENABLED" == true && "$FACTORY_COPILOT_INCLUDED_ONLY_CONFIRMED" == true ]]
          echo 'PILOT_GUARD_PASSED'
      # No checkout, package scripts, third-party actions, PR data, or credentials
      # in this step. The immutable digest is from the official release metadata.
      - name: Install verified Copilot CLI release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/factory-copilot-pilot"
          mkdir -m 700 "$root" "$root/bin" "$root/work" "$root/home"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 200000000 \
            'https://github.com/github/copilot-cli/releases/download/v1.0.116/copilot-linux-x64.tar.gz' -o "$root/copilot.tar.gz"
          printf '%s  %s\n' 'ffea833980a9767a18aff7fd8459085a044266c26ca6a9edafe59cdcff718c79' "$root/copilot.tar.gz" | sha256sum -c -
          tar --extract --gzip --file "$root/copilot.tar.gz" --directory "$root/bin" --no-same-owner --no-same-permissions
          test -x "$root/bin/copilot"
          rm -f "$root/copilot.tar.gz"
          "$root/bin/copilot" --no-auto-update --version
      - name: Single synthetic worker with personal entitlement
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.FACTORY_COPILOT_REQUESTS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$COPILOT_GITHUB_TOKEN" == github_pat_* ]] || { echo '::error::Missing personal fine-grained Copilot Requests token'; exit 1; }
          root="$RUNNER_TEMP/factory-copilot-pilot"
          cd "$root/work"
          # No GITHUB_TOKEN fallback, repository checkout, model shell/write tool,
          # task/subagent delegation, user issue text or raw session publication.
          # The one-credit limit is soft, not a substitute for provider overage controls.
          if ! timeout --kill-after=5s 90s env -i PATH="$PATH" HOME="$root/home" COPILOT_HOME="$root/home/.copilot" CI=true COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN" \
              "$root/bin/copilot" --no-auto-update --no-custom-instructions --disable-builtin-mcps --disable-mcp-server computer-use --available-tools=view --no-ask-user --sync-session=off --max-ai-credits=1 --silent --no-color \
              -p 'Synthetic capability test only. Without using tools, calculate 2+3 and respond exactly FACTORY_COPILOT_PILOT_5 with no other text.' \
              >"$root/result" 2>"$root/diagnostics"; then
            echo '::error::Copilot pilot failed (authentication, policy, model, quota, CLI compatibility, or timeout); inspect provider settings before a new run.'
            exit 1
          fi
          # Exact bytes only: one optional LF, no prefix, suffix, NUL or extra line.
          if ! cmp -s "$root/result" <(printf '%s' 'FACTORY_COPILOT_PILOT_5') && ! cmp -s "$root/result" <(printf '%s\n' 'FACTORY_COPILOT_PILOT_5'); then
            echo '::error::Unexpected synthetic response'
            exit 1
          fi
          printf '%s\n' 'COPILOT_HOSTED_SYNTHETIC_RESPONSE_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'One CLI invocation completed. Personal billing attribution, actual credits consumed and paid-usage enforcement require separate billing evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete private pilot files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/factory-copilot-pilot"
